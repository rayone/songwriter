[project]
name = "songwriter"
version = "0.1.0"
description = "Songwriting workbench: deterministic syllable, stress and rhyme analysis."
readme = "README.md"
license = "MIT"
authors = [{ name = "rayone" }]
requires-python = ">=3.13"
dependencies = [
    "anyio==4.15.1",
    "cmudict==1.1.1",
    "duckdb==1.5.5",
    "fastapi>=0.141.1",
    "mcp==1.2.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songwriter"]

[tool.hatch.build.targets.sdist]
exclude = [
    "dev",
    "attic",
    "data",
    "AGENTS.md",
    "PUBLIC_RELEASE_HARDENING_PLAN.md",
    "*.duckdb*",
    "*.parquet",
    ".pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["src"]
